name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Python 单元测试（实验二任务一新增）
  python-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        cd python_lab
        pip install -r requirements.txt
    - name: Run unit tests
      run: |
        cd python_lab
        pytest -v

  # 前端构建测试
  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npm run build
    - name: Build
      run: npm run build

  # API 测试
  api-test:
    runs-on: ubuntu-latest
    needs: frontend-build
    env:
      TEST_ENV: ${{ secrets.TEST_ENV }}
      DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      DEV_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
      SUPABASE_AUTH_URL: ${{ secrets.SUPABASE_AUTH_URL }}
      SUPABASE_REST_URL: ${{ secrets.SUPABASE_REST_URL }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install dependencies
      run: |
        cd test_api
        pip install -r requirements.txt
    - name: Run API tests
      continue-on-error: true  # CI 中未配置 Supabase 密钥，失败不阻塞流水线
      run: |
        cd test_api
        pytest

  # Web 测试
  web-test:
    runs-on: ubuntu-latest
    needs: frontend-build
    env:
      BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:5173/StudyStride/#/study' }}
      BROWSER: 'chromium'
      HEADLESS: 'true'
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install dependencies
      run: |
        cd test_web
        pip install -r requirements.txt
    - name: Install Playwright browsers
      run: |
        cd test_web
        playwright install chromium
    - name: Start development server
      run: |
        npm ci
        npm run dev &
        sleep 10  # 等待服务器启动
    - name: Run Web tests
      continue-on-error: true  # 依赖在线数据库，失败不阻塞流水线
      run: |
        cd test_web
        pytest

  # 部署前端 + MkDocs 文档站到 GitHub Pages（实验二任务二改造）
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [frontend-build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build for production
        run: npm run build
      - name: Setup Python for MkDocs
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build MkDocs docs-site
        run: |
          pip install mkdocs
          mkdocs build -f docs-site/mkdocs.yml -d "$GITHUB_WORKSPACE/dist/docs-site"  # 相对路径会按 mkdocs.yml 所在目录解析
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
